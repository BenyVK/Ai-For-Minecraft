name: ai-server
version: '${version}'
main: ir.gharri.aiServer.AiServer
api-version: '1.21'
description: AI assistant for Minecraft
commands:
  ai:
    description: Ask the AI a question
    usage: /ai <question> | /ai reset
    permission: aiserver.use
permissions:
  aiserver.use:
    description: Allows using the AI
    default: true